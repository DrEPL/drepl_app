<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="FR-Wolof translation pipeline cover">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1C2333" />
      <stop offset="100%" stop-color="#0D1117" />
    </radialGradient>

    <!-- Flow arrow gradients -->
    <linearGradient id="flow-fr-wo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00BFA6" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
    <linearGradient id="flow-wo-fr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#00BFA6" />
    </linearGradient>

    <!-- ===== LIQUID GLASS — FR ===== -->
    <linearGradient id="fr-tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00BFA6" stop-opacity="0.30" />
      <stop offset="55%"  stop-color="#00BFA6" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#009688" stop-opacity="0.80" />
    </linearGradient>

    <!-- ===== LIQUID GLASS — WO ===== -->
    <linearGradient id="wo-tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.30" />
      <stop offset="55%"  stop-color="#58A6FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.80" />
    </linearGradient>

    <!-- Shared glass overlays -->
    <linearGradient id="glass-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.45" />
      <stop offset="45%"  stop-color="white" stop-opacity="0.05" />
      <stop offset="100%" stop-color="white" stop-opacity="0.18" />
    </linearGradient>

    <radialGradient id="glass-bottom" cx="50%" cy="100%" r="65%">
      <stop offset="0%"   stop-color="black" stop-opacity="0.40" />
      <stop offset="60%"  stop-color="black" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glass-shine-spot" cx="40%" cy="25%" r="35%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.95" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>

    <!-- Soft blur for shadow + shine -->
    <filter id="blur-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="blur-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Ambient orb glow -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Refraction filter applied to the content behind each badge -->
    <filter id="liquid-refract" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" />
      <feGaussianBlur stdDeviation="0.5" />
    </filter>

    <!-- Clip shapes per badge so we can render a refracted backdrop inside each -->
    <clipPath id="fr-clip"><circle cx="110" cy="225" r="58" /></clipPath>
    <clipPath id="wo-clip"><circle cx="690" cy="225" r="58" /></clipPath>

    <!-- Arrow markers -->
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00BFA6" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58A6FF" />
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Ambient orbs -->
  <circle cx="120" cy="120" r="180" fill="#00BFA6" opacity="0.07" filter="url(#soft-glow)" />
  <circle cx="680" cy="330" r="180" fill="#58A6FF" opacity="0.07" filter="url(#soft-glow)" />

  <!-- Subtle grid (rendered before badges so it can be refracted through them) -->
  <g id="grid-layer" stroke="#30363D" stroke-opacity="0.25" stroke-width="0.6">
    <line x1="0"   y1="112" x2="800" y2="112" />
    <line x1="0"   y1="225" x2="800" y2="225" />
    <line x1="0"   y1="338" x2="800" y2="338" />
    <line x1="200" y1="0"   x2="200" y2="450" />
    <line x1="400" y1="0"   x2="400" y2="450" />
    <line x1="600" y1="0"   x2="600" y2="450" />
  </g>

  <!-- Neural network nodes in the middle (decorative) -->
  <g opacity="0.45">
    <g stroke="#8B949E" stroke-width="0.7" stroke-opacity="0.5">
      <line x1="350" y1="150" x2="400" y2="180" />
      <line x1="350" y1="225" x2="400" y2="180" />
      <line x1="350" y1="300" x2="400" y2="180" />
      <line x1="350" y1="150" x2="400" y2="225" />
      <line x1="350" y1="225" x2="400" y2="225" />
      <line x1="350" y1="300" x2="400" y2="225" />
      <line x1="350" y1="150" x2="400" y2="270" />
      <line x1="350" y1="225" x2="400" y2="270" />
      <line x1="350" y1="300" x2="400" y2="270" />
      <line x1="400" y1="180" x2="450" y2="150" />
      <line x1="400" y1="225" x2="450" y2="225" />
      <line x1="400" y1="270" x2="450" y2="300" />
      <line x1="400" y1="180" x2="450" y2="225" />
      <line x1="400" y1="270" x2="450" y2="225" />
    </g>
    <g fill="#E6EDF3">
      <circle cx="350" cy="150" r="4" />
      <circle cx="350" cy="225" r="4" />
      <circle cx="350" cy="300" r="4" />
      <circle cx="400" cy="180" r="5" />
      <circle cx="400" cy="225" r="5" />
      <circle cx="400" cy="270" r="5" />
      <circle cx="450" cy="150" r="4" />
      <circle cx="450" cy="225" r="4" />
      <circle cx="450" cy="300" r="4" />
    </g>
  </g>

  <!-- Flow arrows: FR → WO (top) and WO → FR (bottom) -->
  <path d="M 220 175 C 360 100, 460 100, 580 175"
        stroke="url(#flow-fr-wo)" stroke-width="3" fill="none"
        marker-end="url(#arr-blue)" stroke-linecap="round" />
  <path d="M 580 275 C 460 350, 360 350, 220 275"
        stroke="url(#flow-wo-fr)" stroke-width="3" fill="none"
        marker-end="url(#arr-teal)" stroke-linecap="round" />

  <!-- ============================================================
       LIQUID GLASS BADGE — FR
       Layers from back to front:
       1. drop shadow
       2. wide colored halo
       3. dashed orbit
       4. refracted backdrop (grid + arrows clipped & distorted)
       5. colored tint base
       6. bottom inner shadow (depth)
       7. glossy linear gradient (top→bottom)
       8. blurred specular highlight (top-left)
       9. crisp specular spot
      10. inner rim (light) + outer thin border (dark)
      11. label
       ============================================================ -->
  <g>
    <!-- 1. Drop shadow -->
    <ellipse cx="110" cy="295" rx="55" ry="9" fill="black" opacity="0.55" filter="url(#blur-strong)" />

    <!-- 2. Wide colored halo -->
    <circle cx="110" cy="225" r="82" fill="#00BFA6" opacity="0.12" filter="url(#soft-glow)" />

    <!-- 3. Dashed orbit ring -->
    <circle cx="110" cy="225" r="70" fill="none" stroke="#00BFA6" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3 5" />

    <!-- 4. Refracted backdrop: replays the grid inside the clip with distortion -->
    <g clip-path="url(#fr-clip)" opacity="0.7" filter="url(#liquid-refract)">
      <use href="#grid-layer" />
    </g>

    <!-- 5. Colored tint -->
    <circle cx="110" cy="225" r="58" fill="url(#fr-tint)" />

    <!-- 6. Bottom inner shadow -->
    <circle cx="110" cy="225" r="58" fill="url(#glass-bottom)" opacity="0.6" />

    <!-- 7. Glossy linear overlay -->
    <circle cx="110" cy="225" r="58" fill="url(#glass-gloss)" />

    <!-- 8. Blurred specular highlight (top arc) -->
    <ellipse cx="92" cy="190" rx="34" ry="13" fill="white" opacity="0.45" filter="url(#blur-soft)" />

    <!-- 9. Crisp specular spot -->
    <ellipse cx="86" cy="186" rx="7" ry="3" fill="white" opacity="0.95" />

    <!-- 10. Inner rim (light) + outer rim (dark) -->
    <circle cx="110" cy="225" r="58" fill="none" stroke="white" stroke-opacity="0.55" stroke-width="0.9" />
    <circle cx="110" cy="225" r="58.6" fill="none" stroke="black" stroke-opacity="0.35" stroke-width="0.7" />

    <!-- 11. Label -->
    <text x="110" y="240" text-anchor="middle" font-family="Poppins, Inter, sans-serif" font-weight="800" font-size="46" fill="white" opacity="0.96">FR</text>
  </g>

  <!-- ============================================================
       LIQUID GLASS BADGE — WO
       ============================================================ -->
  <g>
    <ellipse cx="690" cy="295" rx="55" ry="9" fill="black" opacity="0.55" filter="url(#blur-strong)" />

    <circle cx="690" cy="225" r="82" fill="#58A6FF" opacity="0.12" filter="url(#soft-glow)" />

    <circle cx="690" cy="225" r="70" fill="none" stroke="#58A6FF" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3 5" />

    <g clip-path="url(#wo-clip)" opacity="0.7" filter="url(#liquid-refract)">
      <use href="#grid-layer" />
    </g>

    <circle cx="690" cy="225" r="58" fill="url(#wo-tint)" />
    <circle cx="690" cy="225" r="58" fill="url(#glass-bottom)" opacity="0.6" />
    <circle cx="690" cy="225" r="58" fill="url(#glass-gloss)" />

    <ellipse cx="672" cy="190" rx="34" ry="13" fill="white" opacity="0.45" filter="url(#blur-soft)" />
    <ellipse cx="666" cy="186" rx="7" ry="3" fill="white" opacity="0.95" />

    <circle cx="690" cy="225" r="58" fill="none" stroke="white" stroke-opacity="0.55" stroke-width="0.9" />
    <circle cx="690" cy="225" r="58.6" fill="none" stroke="black" stroke-opacity="0.35" stroke-width="0.7" />

    <text x="690" y="240" text-anchor="middle" font-family="Poppins, Inter, sans-serif" font-weight="800" font-size="46" fill="white" opacity="0.96">WO</text>
  </g>

  <!-- Caption -->
  <g text-anchor="middle" font-family="'Fira Code', monospace">
    <text x="400" y="405" fill="#8B949E" font-size="13" letter-spacing="2">NLLB-200  +  LoRA  +  MLflow</text>
    <text x="400" y="428" fill="#6E7681" font-size="11" letter-spacing="3">FR  ⇄  WOLOF   ·   BLEU 18.89</text>
  </g>
</svg>
